name: Publish standalone template downloads

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenticfusion-template-downloads
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and publish one ZIP per branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          if [[ ${#branches[@]} -eq 0 ]]; then
            echo "GitHub returned no repository branches." >&2
            exit 1
          fi
          declare -A asset_names=()
          assets=()
          for branch in "${branches[@]}"; do
            safe_branch="$(printf '%s' "$branch" | sed 's#[^A-Za-z0-9._-]#-#g')"
            asset_name="AgenticFusionTemplate-${safe_branch}.zip"
            if [[ -n "${asset_names[$asset_name]:-}" ]]; then
              echo "Branch-name collision while creating release asset: $asset_name" >&2
              exit 1
            fi
            asset_names[$asset_name]=1
            git fetch --no-tags origin "$branch"
            git archive --format=zip --output="$RUNNER_TEMP/$asset_name" "FETCH_HEAD" AgenticFusionTemplate
            assets+=("$RUNNER_TEMP/$asset_name")
          done
          tag="template-downloads"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target main \
              --title "AgenticFusionTemplate downloads" \
              --notes "Standalone AgenticFusionTemplate ZIP snapshots, refreshed automatically from repository branches."
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
